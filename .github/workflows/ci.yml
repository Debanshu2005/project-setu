name: Project Setu CI & Quality Gate

on:
  push:
    branches: [ main, feature/**, fix/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # Job 1: Native C++ Build and Test on Linux (Ubuntu GCC/Clang)
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  build-and-test-linux:
    name: Native C++ Core (Linux GCC 13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build all targets
        run: cmake --build build --config Release -j$(nproc)

      - name: Run CTest test suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Test interactive CLI engine directly
        run: |
          printf '{"cmd":"init","survivors":5,"relays":2,"zone":600,"seed":42}\n{"cmd":"trigger","node":1,"kind":"short"}\n{"cmd":"step","ms":1000}\n{"cmd":"summary"}\n{"cmd":"quit"}\n' | ./build/setu_sim -i > sim_cli_out.jsonl
          cat sim_cli_out.jsonl
          grep -q '"cmd":"summary"' sim_cli_out.jsonl || (echo "Summary not found in CLI output" && exit 1)

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # Job 2: Native C++ Build and Test on Windows (MSVC 2022)
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  build-and-test-windows:
    name: Native C++ Core (Windows MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build with PowerShell build script
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1

      - name: Execute automated test suite
        run: powershell -ExecutionPolicy Bypass -File scripts/test_windows.ps1

      - name: Run Golden and Portable Baselines on Windows MSVC
        run: node tests/test_golden_baselines.mjs

  # Job 2b: Native C++ Build and Test on Linux (Ubuntu Clang)
  build-and-test-linux-clang:
    name: Native C++ Core (Linux Clang)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Clang build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build

      - name: Configure CMake with Clang
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build all targets with Clang
        run: cmake --build build --config Release

      - name: Run CTest test suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify Golden and Portable Baselines on Linux Clang
        run: node tests/test_golden_baselines.mjs

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # Job 2c: WebAssembly Build and Native Parity Verification (Emscripten)
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  build-and-test-wasm:
    name: WebAssembly Simulation Core (Emscripten & Parity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.53

      - name: Build native simulator for parity reference
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j$(nproc)

      - name: Configure and build WebAssembly simulator
        run: |
          emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm --target setu_sim_wasm --config Release
          mkdir -p dashboard/wasm
          cp build-wasm/setu_sim_wasm.js dashboard/wasm/
          cp build-wasm/setu_sim_wasm.wasm dashboard/wasm/

      - name: Measure WebAssembly binary size
        run: |
          ls -la dashboard/wasm/
          WASM_SIZE=$(stat -c %s dashboard/wasm/setu_sim_wasm.wasm)
          WASM_KB=$(awk "BEGIN {printf \"%.2f\", $WASM_SIZE / 1024}")
          echo "::notice title=WebAssembly Binary Size::$WASM_SIZE bytes (${WASM_KB} KB)"
          echo "WASM_SIZE=$WASM_SIZE" >> $GITHUB_ENV
          echo "WASM_KB=$WASM_KB" >> $GITHUB_ENV

      - name: Verify line-by-line parity against native simulator
        run: node tests/test_engine_parity.mjs

      - name: Upload WebAssembly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: setu-sim-wasm-artifacts
          path: |
            dashboard/wasm/setu_sim_wasm.js
            dashboard/wasm/setu_sim_wasm.wasm

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # Job 3: Docker Container Build & Healthcheck Verification
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  docker-validation:
    name: Docker Multi-Stage Build & Container Health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (includes inside-container ctest execution)
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t project-setu-backend:ci .

      - name: Test container startup and healthcheck
        run: |
          docker run -d --name setu-ci-container -p 3000:3000 project-setu-backend:ci
          sleep 5
          docker logs setu-ci-container
          curl -s -f http://localhost:3000/health | grep '"status":"ok"' || (echo "Healthcheck failed" && exit 1)
          curl -s -f http://localhost:3000/api/status | grep '"simulatorFound":true' || (echo "Simulator not detected in container" && exit 1)
          curl -s -f http://localhost:3000/version | grep '"service":"project-setu-backend"' || (echo "Backend /version check failed" && exit 1)
          docker stop setu-ci-container
          docker rm setu-ci-container

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # Job 4: Node.js Backend & API Verification
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  backend-and-scenario-checks:
    name: All JavaScript Test Suites (Linux Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate server syntax
        run: node --check dashboard/server.js

      - name: Validate scenarios JSON formatting
        run: |
          for f in scenarios/*.json; do
            node -e "JSON.parse(fs.readFileSync('$f', 'utf8'))" || (echo "Invalid JSON: $f" && exit 1)
          done

      - name: Install dependencies and Playwright Chromium
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Build native simulator for backend tests
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j$(nproc)

      - name: Run automated backend test suite
        run: |
          set -o pipefail
          npm test 2>&1 | tee test_results.log

      - name: Upload Hardware Explorer Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-explorer-screenshots
          path: docs/screens/hardware/*.png

      - name: Capture Test Failure Summary
        if: always()
        run: |
          tail -n 80 test_results.log || true
          ERR_LINES=$(grep -iE 'fail|fatal|error|exception|assert' test_results.log | tail -n 8 | tr '\n' ' ' | head -c 400)
          echo "::error title=Failure Detail::$ERR_LINES"
          echo "### Test Execution Output (Last 120 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 test_results.log >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # Job 5: ESP-IDF ESP32-S3 Target Firmware Build Verification
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  firmware-build-esp32s3:
    name: ESP-IDF ESP32-S3 Firmware Build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile ESP32-S3 Firmware Target
        working-directory: firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # Job 6: PlatformIO ESP32-S3 Firmware Target Build Verification
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  firmware-build-platformio:
    name: PlatformIO ESP32-S3 Firmware Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Compile ESP32-S3 Target Firmware with PlatformIO
        run: pio run -e esp32-s3-devkitc-1


