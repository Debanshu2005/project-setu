# ==============================================================================
# Render Blueprint Specification — Project Setu
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: project-setu-backend
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: ALLOW_VERCEL_PREVIEWS
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
        value: "https://project-setu.vercel.app,http://localhost:3000,http://localhost:5173"
