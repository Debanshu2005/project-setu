; PlatformIO Project Configuration File for Project Setu ESP32-S3 Firmware
; Target: Espressif ESP32-S3-DevKitC-1-N8 (8 MB Quad Flash, 240 MHz Dual-Core Xtensa LX7)
; Framework: ESP-IDF (Official Espressif IoT Development Framework)

[platformio]
default_envs = esp32-s3-devkitc-1
src_dir = firmware/main
include_dir = firmware/esp32s3/include

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = firmware/partitions.csv
board_build.esp-idf.sdkconfig_defaults = firmware/sdkconfig.defaults

build_flags =
    -std=gnu++17
    -D ESP_PLATFORM
    -I shared/include
    -I firmware/esp32s3/include
